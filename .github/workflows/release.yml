name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo: "0"
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o flowterm .
          tar -czf "flowterm_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" flowterm

      - uses: actions/upload-artifact@v4
        with:
          name: flowterm_${{ matrix.goos }}_${{ matrix.goarch }}
          path: "*.tar.gz"
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
